<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" stroke="#fff" stroke-width="1.5">
  <!-- coordinate grid + axes -->
  <g stroke-opacity=".55" stroke-width="1"><path d="M0 320H640M320 0V640"/><path d="M0 160H640M0 480H640M160 0V640M480 0V640" stroke-dasharray="3 7"/></g>
  <!-- y = sin x, y = x^2 style curves -->
  <path d="M0 320C53 200 107 200 160 320S267 440 320 320 427 200 480 320 587 440 640 320"/>
  <path d="M120 640C200 340 260 330 320 330S440 340 520 640" stroke-opacity=".7"/>
  <!-- gear (8 teeth) -->
  <g transform="translate(500 130)">
    <circle r="34"/><circle r="12"/>
    <g id="t"><path d="M-6 -34h12v-12h-12z"/></g>
    <use href="#t" transform="rotate(45)"/><use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(135)"/>
    <use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(225)"/><use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(315)"/>
  </g>
  <!-- small gear -->
  <g transform="translate(110 520) scale(.7)">
    <circle r="34"/><circle r="12"/>
    <use href="#t"/><use href="#t" transform="rotate(45)"/><use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(135)"/>
    <use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(225)"/><use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(315)"/>
  </g>
  <!-- graph nodes -->
  <g fill="#fff" stroke="none" fill-opacity=".8"><circle cx="90" cy="110" r="4"/><circle cx="220" cy="60" r="4"/><circle cx="300" cy="170" r="4"/><circle cx="560" cy="430" r="4"/><circle cx="430" cy="560" r="4"/></g>
  <path d="M90 110L220 60L300 170L90 110M560 430L430 560" stroke-opacity=".8"/>
</svg>
